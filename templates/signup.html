<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>안넘어집 | 회원가입</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="auth-body">
<div class="auth-shell">
  <a href="{{ url_for('home') }}" class="auth-brand">🏡 안넘어집</a>

  <div class="auth-card">
    <h1 class="auth-title">회원가입</h1>
    <p class="auth-subtitle">간단한 정보만 입력하면 바로 낙상 위험 분석을 시작할 수 있어요.</p>

    <form id="signup-form" class="auth-form" novalidate>
      <label>이름
        <input type="text" name="name" required autocomplete="name" placeholder="홍길동" />
      </label>
      <label>이메일
        <input type="email" name="email" required autocomplete="email" placeholder="you@example.com" />
      </label>
      <label>비밀번호
        <input type="password" name="password" required autocomplete="new-password" placeholder="6자 이상" minlength="6" />
      </label>
      <label>비밀번호 확인
        <input type="password" name="password_confirm" required autocomplete="new-password" placeholder="비밀번호 다시 입력" />
      </label>
      <p class="auth-error" id="signup-error"></p>
      <button type="submit" class="btn btn-block" id="signup-submit">회원가입</button>
    </form>

    <p class="auth-switch">이미 계정이 있으신가요? <a href="{{ url_for('login_page') }}">로그인</a></p>
  </div>
</div>

<script>
document.getElementById("signup-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const form = event.target;
  const errorEl = document.getElementById("signup-error");
  const submitBtn = document.getElementById("signup-submit");
  errorEl.textContent = "";

  if (form.password.value !== form.password_confirm.value) {
    errorEl.textContent = "비밀번호가 서로 일치하지 않습니다.";
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "가입 중...";

  try {
    const res = await fetch("/api/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: form.name.value,
        email: form.email.value,
        password: form.password.value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "회원가입에 실패했습니다.");
    window.location.href = "{{ url_for('home') }}";
  } catch (error) {
    errorEl.textContent = error.message;
    submitBtn.disabled = false;
    submitBtn.textContent = "회원가입";
  }
});
</script>
</body>
</html>
